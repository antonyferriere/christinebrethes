name: Deploy PREPROD (FTP)

on:
  push:
    branches: [preprod]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-preprod
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: PREPROD

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Le site n'a aucune dépendance npm : aucun npm ci ni cache npm nécessaires.
      - name: Build and test site
        run: npm run check

      - name: Verify deployment files
        run: |
          test -f dist/index.html
          test -f dist/.htaccess

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: dist/
          server-dir: ${{ secrets.FTP_DIR }}
          dangerous-clean-slate: false
